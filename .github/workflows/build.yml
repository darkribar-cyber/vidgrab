name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk zlib1g-dev libffi-dev
        pip install buildozer cython

    - name: Create spec file
      run: |
        echo "[app]" > buildozer.spec
        echo "title = VidGrab" >> buildozer.spec
        echo "package.name = vidgrab" >> buildozer.spec
        echo "package.domain = com.vidgrab" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py" >> buildozer.spec
        echo "version = 1.0" >> buildozer.spec
        echo "requirements = python3,flask,yt-dlp" >> buildozer.spec
        echo "orientation = portrait" >> buildozer.spec
        echo "android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "[buildozer]" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab-APK
        path: bin/*.apk
